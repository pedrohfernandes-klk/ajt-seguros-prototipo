<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Símbolo AJT">
  <title>AJT Seguros — símbolo</title>
  <!-- Vetorização aproximada, feita a partir da montra e do papel timbrado.
       Substituir pelo ficheiro vetorial original quando estiver disponível. -->
  <g fill="none" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Perna esquerda e vértice — o traço claro do laço -->
    <path d="M23 83 L48 23" stroke="#3d9ad8"/>
    <!-- Travessa -->
    <path d="M36 62 L60 62" stroke="#2878b0"/>
    <!-- Perna direita — o traço escuro, que passa por cima no vértice -->
    <path d="M48 23 L73 83" stroke="#17527f"/>
  </g>
</svg>
