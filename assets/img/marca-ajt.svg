<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Símbolo AJT">
  <title>AJT Seguros — símbolo</title>
  <!-- Vetorização temporária a partir do papel timbrado da AJT.
       Substituir pelo ficheiro vetorial original quando disponível. -->
  <defs>
    <linearGradient id="mkClaro" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#8ed3f0"/>
      <stop offset="100%" stop-color="#3f9fd4"/>
    </linearGradient>
    <linearGradient id="mkEscuro" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3b9bd0"/>
      <stop offset="55%"  stop-color="#1f6ea3"/>
      <stop offset="100%" stop-color="#164a72"/>
    </linearGradient>
    <linearGradient id="mkBarra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5fb4e0"/>
      <stop offset="100%" stop-color="#2078ac"/>
    </linearGradient>
  </defs>

  <g stroke-linejoin="round" stroke-width="2.5">
    <!-- Perna direita -->
    <path d="M48 8 L90 88 L69 88 L48 44 Z" fill="url(#mkEscuro)" stroke="url(#mkEscuro)"/>
    <!-- Perna esquerda (a dobra clara do laço) -->
    <path d="M48 8 L6 88 L27 88 L48 44 Z" fill="url(#mkClaro)" stroke="url(#mkClaro)"/>
    <!-- Travessa -->
    <path d="M32 58 L64 58 L70 71 L26 71 Z" fill="url(#mkBarra)" stroke="url(#mkBarra)"/>
  </g>
</svg>
