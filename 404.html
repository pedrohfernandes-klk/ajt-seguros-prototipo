<title>Página não encontrada — AJT Seguros</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- ⚙️ ESTA PÁGINA É AUTÓNOMA — E TEM DE CONTINUAR A SÊ-LO.
     O servidor devolve o 404 a partir de qualquer endereço inexistente
     (/seguros/xpto.html, /a/b/c/...). Como o endereço na barra continua a
     ser o que o visitante pediu, qualquer caminho relativo para o CSS, o
     JavaScript ou as imagens aponta para o sítio errado e a página aparece
     sem formatação.
     Por isso o estilo vai todo aqui dentro e não há imagens externas.
     Se editar, mantenha-a sem ligações a assets/. -->
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    display:grid; place-items:center; padding:32px;
    background:#0d2233; color:#b6c7d3;
    font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.68; text-align:center;
  }
  main{ width:min(100%, 620px) }
  .marca{
    display:inline-flex; align-items:center; gap:12px;
    margin-bottom:44px; text-decoration:none;
  }
  .marca svg{ width:44px; height:44px; flex:none }
  .marca b{
    font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.14rem;
    color:#fff; letter-spacing:-.01em;
  }
  .etiqueta{
    font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:.98rem;
    font-variation-settings:"SOFT" 30,"WONK" 1;
    color:#6f9db4; margin:0 0 18px;
  }
  h1{
    font-family:"Fraunces",Georgia,serif; font-weight:600;
    font-size:clamp(2.15rem,6.2vw,3.6rem); line-height:1.06; letter-spacing:-.018em;
    color:#fff; margin:0; text-wrap:balance;
  }
  h1 em{
    font-style:italic; font-variation-settings:"SOFT" 40,"WONK" 1; color:#6f9db4;
  }
  p.lede{ font-size:1.05rem; margin:24px auto 34px; max-width:46ch }
  .accoes{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center }
  a.botao{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    padding:15px 24px; border-radius:3px; border:1px solid transparent;
    font-size:.94rem; font-weight:600; text-decoration:none;
    transition:background .28s, color .28s, border-color .28s;
  }
  .primario{ background:#fff; color:#0d2233 }
  .primario:hover{ background:#ece3d3 }
  .secundario{ color:#fff; border-color:rgba(255,255,255,.42) }
  .secundario:hover{ background:#fff; color:#0d2233; border-color:#fff }
  .tel{ margin-top:36px; font-size:.88rem; opacity:.8 }
  .tel a{ color:#fff; font-weight:600 }
  :focus-visible{ outline:3px solid #6f9db4; outline-offset:3px }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main>
  <a class="marca" href="#" data-para="">
    <svg viewBox="0 0 96 96" aria-hidden="true" fill="none"
         stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 83 L48 23" stroke="#8ed3f0"/>
      <path d="M36 62 L60 62" stroke="#cfe9f7"/>
      <path d="M48 23 L73 83" stroke="#ffffff"/>
    </svg>
    <b>AJT Seguros</b>
  </a>

  <!-- ✏️ EDITAR: mensagem -->
  <p class="etiqueta">Erro 404</p>
  <h1>Esta página<br><em>não existe.</em></h1>
  <p class="lede">Deve ter sido movida, ou o endereço tem um engano. Nada de grave — mostramos-lhe o caminho de volta.</p>

  <div class="accoes">
    <a class="botao primario" href="#" data-para="">
      Ir para a página inicial
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
    </a>
    <a class="botao secundario" href="#" data-para="contactos.html">Contactos</a>
  </div>

  <p class="tel">Ou ligue-nos: <a href="tel:+351212348047">212 348 047</a></p>
</main>

<script>
  // Descobre a raiz do site e completa as ligações.
  // Funciona num domínio próprio (raiz) e numa subpasta do GitHub Pages.
  (function () {
    var raiz = '/';
    if (location.hostname.slice(-10) === 'github.io') {
      raiz = '/' + location.pathname.split('/')[1] + '/';
    }
    var alvos = document.querySelectorAll('[data-para]');
    for (var i = 0; i < alvos.length; i++) {
      alvos[i].href = raiz + alvos[i].getAttribute('data-para');
    }
  })();
</script>
</body>
